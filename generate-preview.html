<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Preview Image Generator (1200x630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Great+Vibes&family=Tiro+Devanagari+Hindi&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a0508;
    color: #fff8e7;
    font-family: 'Cinzel', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 15px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.5rem;
    color: #f3d98b;
    margin-bottom: 8px;
    letter-spacing: 0.1em;
    text-align: center;
  }
  p.sub {
    font-size: 0.95rem;
    color: #e2c99b;
    margin-bottom: 20px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
  }
  .preview-wrapper {
    width: 100%;
    max-width: 900px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 0 2px #d4af37;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
  }
  canvas {
    width: 100%;
    height: auto;
    display: block;
  }
  .controls {
    margin-top: 24px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: linear-gradient(135deg, #9c7a1e, #f3d98b 35%, #d4af37 60%, #9c7a1e);
    color: #3d070f;
    border: none;
    padding: 14px 28px;
    font-family: 'Cinzel', serif;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(212,175,55,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(212,175,55,0.6);
  }
</style>
</head>
<body>

  <h1>WEDDING PREVIEW CARD GENERATOR</h1>
  <p class="sub">1200 x 630px high-resolution Open Graph banner for WhatsApp, Facebook & Twitter</p>

  <div class="preview-wrapper">
    <canvas id="cardCanvas" width="1200" height="630"></canvas>
  </div>

  <div class="controls">
    <button id="downloadBtn" type="button">⬇️ Download preview.png</button>
  </div>

<script>
window.addEventListener('load', async () => {
  // Wait for Google web fonts to load
  if (document.fonts) {
    await document.fonts.ready;
  }
  drawCard();
});

function drawCard() {
  const canvas = document.getElementById('cardCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1200;
  const H = 630;

  // 1. Background: Deep royal maroon radial gradient
  const bg = ctx.createRadialGradient(W / 2, H / 2, 80, W / 2, H / 2, W / 1.1);
  bg.addColorStop(0, '#5f0f1b');
  bg.addColorStop(0.55, '#3a070f');
  bg.addColorStop(1, '#200307');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 2. Subtle radial gold glow behind center
  const glow = ctx.createRadialGradient(W / 2, 330, 40, W / 2, 330, 360);
  glow.addColorStop(0, 'rgba(243, 217, 139, 0.16)');
  glow.addColorStop(0.6, 'rgba(212, 175, 55, 0.05)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // 3. Ornate Double Gold Borders
  ctx.save();
  // Outer border
  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 3;
  ctx.strokeRect(28, 28, W - 56, H - 56);

  // Secondary fine inner line
  ctx.strokeStyle = 'rgba(243, 217, 139, 0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(36, 36, W - 72, H - 72);

  // Dashed innermost border
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
  ctx.strokeRect(46, 46, W - 92, H - 92);
  ctx.setLineDash([]);
  ctx.restore();

  // 4. Corner Ornamental Accents
  function drawCorner(x, y, flipX, flipY) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
    ctx.strokeStyle = '#f3d98b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, 50);
    ctx.lineTo(10, 10);
    ctx.lineTo(50, 10);
    ctx.stroke();

    ctx.fillStyle = '#f3d98b';
    ctx.beginPath();
    ctx.arc(10, 10, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(28, 28, 3, 0, Math.PI * 2);
    ctx.fill();

    // Small decorative leaf curve
    ctx.beginPath();
    ctx.moveTo(10, 10);
    ctx.quadraticCurveTo(34, 12, 34, 34);
    ctx.quadraticCurveTo(12, 34, 10, 10);
    ctx.fillStyle = 'rgba(212, 175, 55, 0.35)';
    ctx.fill();
    ctx.restore();
  }

  drawCorner(54, 54, false, false);
  drawCorner(W - 54, 54, true, false);
  drawCorner(54, H - 54, false, true);
  drawCorner(W - 54, H - 54, true, true);

  // 5. Auspicious Shloka
  ctx.textAlign = 'center';
  ctx.fillStyle = '#f3d98b';
  ctx.font = '500 24px "Tiro Devanagari Hindi", serif';
  ctx.fillText('॥ श्री गणेशाय नमः ॥', W / 2, 102);

  // 6. Header Tagline
  ctx.font = '700 13px "Cinzel", serif';
  ctx.letterSpacing = '5px';
  ctx.fillStyle = '#e8be66';
  ctx.fillText('THE WEDDING CELEBRATION OF', W / 2, 142);

  // 7. Decorative flourishes flanking couple names
  function drawFlourish(cx, cy, dir) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(dir * 120, 0);
    ctx.stroke();

    ctx.fillStyle = '#f3d98b';
    ctx.beginPath();
    ctx.arc(dir * 125, 0, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  drawFlourish(W / 2 - 320, 275, -1);
  drawFlourish(W / 2 + 320, 275, 1);

  // 8. Couple Names: Muskan & Devesh (Grand Golden Gradient)
  const nameGrad = ctx.createLinearGradient(W / 2 - 250, 0, W / 2 + 250, 0);
  nameGrad.addColorStop(0, '#e5be65');
  nameGrad.addColorStop(0.35, '#fff0bd');
  nameGrad.addColorStop(0.65, '#d4af37');
  nameGrad.addColorStop(1, '#f9df90');

  ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 4;

  ctx.fillStyle = nameGrad;
  ctx.font = '400 96px "Great Vibes", cursive';
  ctx.fillText('Muskan', W / 2 - 130, 290);

  ctx.font = '700 38px "Cinzel", serif';
  ctx.fillStyle = '#f3d98b';
  ctx.fillText('&', W / 2, 278);

  ctx.fillStyle = nameGrad;
  ctx.font = '400 96px "Great Vibes", cursive';
  ctx.fillText('Devesh', W / 2 + 130, 290);

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;

  // 9. Subtitle
  ctx.fillStyle = '#f5e4c3';
  ctx.font = '400 24px "Cormorant Garamond", serif';
  ctx.letterSpacing = '1px';
  ctx.fillText('Cordially invite you to celebrate the sacred union of their love', W / 2, 360);

  // 10. Date Badge / Banner Container
  const bW = 540;
  const bH = 88;
  const bX = (W - bW) / 2;
  const bY = 405;

  ctx.fillStyle = 'rgba(30, 3, 7, 0.7)';
  ctx.beginPath();
  ctx.roundRect(bX, bY, bW, bH, 44);
  ctx.fill();

  ctx.strokeStyle = '#d4af37';
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // "SAVE THE DATE"
  ctx.font = '700 12px "Cinzel", serif';
  ctx.fillStyle = '#d4af37';
  ctx.letterSpacing = '4px';
  ctx.fillText('— SAVE THE DATE —', W / 2, bY + 32);

  // "WEDNESDAY · 02 DECEMBER 2026"
  ctx.font = '700 24px "Cinzel", serif';
  ctx.fillStyle = '#fff4d1';
  ctx.letterSpacing = '3px';
  ctx.fillText('WEDNESDAY · 02 DECEMBER 2026', W / 2, bY + 65);

  // 11. Bottom Action Hint (WhatsApp Preview Tap Cue)
  ctx.font = '500 16px "Cormorant Garamond", serif';
  ctx.fillStyle = '#e8c99b';
  ctx.letterSpacing = '2px';
  ctx.fillText('TAP TO OPEN INVITATION CARD & EVENT SCHEDULE ✉️', W / 2, 545);

  // 12. Bottom Website Link
  ctx.font = '600 12px "Cinzel", serif';
  ctx.fillStyle = '#9c7a1e';
  ctx.letterSpacing = '3px';
  ctx.fillText('WADING-INVITATION.VERCEL.APP', W / 2, 575);
}

// Download Button
document.getElementById('downloadBtn').addEventListener('click', () => {
  const canvas = document.getElementById('cardCanvas');
  const a = document.createElement('a');
  a.download = 'preview.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
